name: Build Android APK

# Chạy tay: tab Actions -> "Build Android APK" -> Run workflow
# Hoặc tự chạy khi đẩy tag dạng v1.0.0
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài gói
        run: npm install

      - name: Chép file web vào www
        run: npm run prepare-www

      - name: Tạo project Android
        run: npx cap add android

      - name: Đồng bộ
        run: npx cap sync android

      - name: Dùng khóa ký cố định (nếu đã tạo secret DEBUG_KEYSTORE_B64)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Build APK (debug, cài thẳng được)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tim-nha-thue-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
