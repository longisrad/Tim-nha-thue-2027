name: Build Android APK

# Chạy tay: tab Actions -> "Build Android APK" -> Run workflow
# Hoặc tự chạy khi đẩy tag dạng v1.0.0
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # cần để tạo Release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Maven Central đôi khi trả lỗi 429 (giới hạn tải) cho máy chủ GitHub. Lưu sẵn thư viện Gradle để lần sau không phải tải lại.
      - name: Khôi phục bộ nhớ đệm Gradle
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}-
            gradle-${{ runner.os }}-

      - name: Cài gói
        # Có package-lock.json (nên commit) thì cài đúng phiên bản đã khóa, build lặp lại được.
        run: |
          if [ -f package-lock.json ]; then npm ci || npm install; else npm install; fi

      - name: Build web (gộp app.js) vào www
        run: npm run prepare-www

      - name: Kiểm tra file trong www
        # scripts/prepare-www.js đã tự đối chiếu index.html với www/. Ở đây chỉ kiểm file bắt buộc.
        run: |
          ls -l www
          for f in index.html app.js sw.js manifest.webmanifest; do
            test -f "www/$f" || { echo "::error::Thiếu www/$f"; exit 1; }
          done

      - name: Tạo project Android
        run: npx cap add android

      - name: Đặt phiên bản (versionCode / versionName)
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VER=$(node -p "require('./package.json').version")
            TAG="v${VER%.*}.${GITHUB_RUN_NUMBER}"
          fi
          NAME="${TAG#v}"
          GRADLE=android/app/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"${NAME}\"/" "$GRADLE"
          grep -n "versionCode\|versionName" "$GRADLE"
          grep -q "versionCode ${GITHUB_RUN_NUMBER}" "$GRADLE" || { echo "::error::Không đặt được versionCode trong build.gradle"; exit 1; }
          echo "{\"version\":\"${NAME}\",\"build\":${GITHUB_RUN_NUMBER}}" > www/version.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Tạo icon Android
        run: npx capacitor-assets generate --android

      - name: Splash icon nét (Android 12+)
        run: |
          RES=android/app/src/main/res
          mkdir -p "$RES/drawable-nodpi"
          cp android-res/splash_icon.png "$RES/drawable-nodpi/splash_icon.png"
          python3 - <<'PY'
          import re, sys
          p = 'android/app/src/main/res/values/styles.xml'
          s = open(p, encoding='utf-8').read()
          m = re.search(r'(<style name="AppTheme\.NoActionBarLaunch"[^>]*>)(.*?)(</style>)', s, re.S)
          if not m:
              print('::warning::Không thấy style AppTheme.NoActionBarLaunch, bỏ qua')
              sys.exit(0)
          body = m.group(2)
          add = ''
          if 'windowSplashScreenAnimatedIcon' not in body:
              add += '\n        <item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>'
          if 'windowSplashScreenBackground' not in body:
              add += '\n        <item name="windowSplashScreenBackground">#0C1C30</item>'
          s = s[:m.end(2)] + add + '\n    ' + s[m.end(2):]
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n -A6 'NoActionBarLaunch' "$RES/values/styles.xml"

      - name: Kiểm tra icon đã sinh
        run: |
          echo "== File nguồn trong assets (so md5 với bản mới) =="
          md5sum assets/icon-only.png assets/icon-foreground.png assets/icon-background.png
          echo "== Icon Android được sinh ra =="
          ls -l android/app/src/main/res/mipmap-xxxhdpi/
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png || { echo "::error::Không sinh được icon Android, kiểm tra tên file trong assets/"; exit 1; }

      - name: Bật service worker trong APK (để lưu ảnh bền)
        # Capacitor Android mặc định không cho trang đăng ký service worker ("unknown error when fetching the script").
        # Chuyển yêu cầu của service worker về máy chủ nội bộ của Capacitor, như yêu cầu của trang.
        # Nếu sau khi cài APK bị trắng màn hình: xóa bước này là về như cũ.
        run: |
          python3 - <<'PY'
          import glob, re, sys
          files = glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True)
          if not files:
              print('::error::Không thấy MainActivity.java'); sys.exit(1)
          p = files[0]
          s = open(p, encoding='utf-8').read()
          if 'ServiceWorkerClient' in s:
              print('Đã có sẵn, bỏ qua'); sys.exit(0)
          pkg = re.search(r'^package\s+([\w.]+);', s, re.M).group(1)
          java = """package %s;

          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.ServiceWorkerClient;
          import android.webkit.ServiceWorkerController;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      ServiceWorkerController.getInstance().setServiceWorkerClient(new ServiceWorkerClient() {
                          @Override
                          public WebResourceResponse shouldInterceptRequest(WebResourceRequest request) {
                              return getBridge().getLocalServer().shouldInterceptRequest(request);
                          }
                      });
                  }
              }
          }
          """ % pkg
          open(p, 'w', encoding='utf-8').write(java)
          print(java)
          PY

      - name: Đồng bộ
        run: npx cap sync android

      - name: Build APK release (chưa ký)
        working-directory: android
        run: |
          for i in 1 2 3 4; do
            ./gradlew assembleRelease --no-daemon && exit 0
            echo "::warning::Build lần $i lỗi (thường do Maven Central giới hạn tải, mã 429). Chờ rồi thử lại, thư viện đã tải được giữ nguyên."
            sleep $((i * 60))
          done
          echo "::error::Build lỗi sau 4 lần thử"
          exit 1

      - name: Lưu bộ nhớ đệm Gradle
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}-${{ github.run_id }}

      - name: Ký APK bằng khóa riêng
        id: v
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Thiếu secret ký APK (RELEASE_KEYSTORE_B64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD). Xem hướng dẫn tạo khóa."
            exit 1
          fi
          TAG="${{ steps.ver.outputs.tag }}"
          APK="Tim-nha-thue-${TAG}.apk"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          SRC=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$SRC" "$RUNNER_TEMP/aligned.apk"
          KS_PASS="$KS_PASS" KEY_PASS="$KEY_PASS" "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$APK"
          rm -f "$RUNNER_TEMP/release.jks"
          sha256sum "$APK" > "$APK.sha256"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Tim-nha-thue-${{ steps.v.outputs.tag }}
          path: |
            ${{ steps.v.outputs.apk }}
            ${{ steps.v.outputs.apk }}.sha256

      - name: Tạo Release trên GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Chạy tay (không phải đẩy tag) -> đánh dấu bản thử, không lẫn với bản chính thức
          PRE=""
          [[ "$GITHUB_REF" == refs/tags/* ]] || PRE="--prerelease"
          gh release create "${{ steps.v.outputs.tag }}" \
            "${{ steps.v.outputs.apk }}" "${{ steps.v.outputs.apk }}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Tìm nhà thuê ${{ steps.v.outputs.tag }}" \
            --generate-notes $PRE
